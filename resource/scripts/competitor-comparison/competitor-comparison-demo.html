<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Competitor Comparison — SellingPilot</title><link rel="stylesheet" href="resource/css/competitor-comparison/competitor-comparison.css"><link rel="stylesheet" href="resource/css/sellingpilot/sellingpilot-shared-navigation.css"></head><body>
<div class="demo-bar"><span>AI竞品对比 · 交互演示 · 示例数据</span><button id="enlarge" type="button">放大演示</button></div>
<div class="app sidebar-collapsed"><header class="global-header" data-module="competitor"></header>
<aside class="system-sidebar"><button id="sidebar-toggle" type="button" class="icon-button" aria-label="Expand sidebar" aria-expanded="false"></button><div class="system-links"><button data-route="image"><span class="system-icon">AI</span><span data-t="AI Generators"></span></button><button id="insights-toggle" aria-expanded="true"><span class="system-icon" id="insights-icon"></span><span data-t="AI Insights"></span></button><div class="system-submenu"><button data-t="Customer Reviews"></button><button class="selected" data-t="Competitor Comparison"></button><button data-route="assistant" data-t="AI Assistant"></button></div></div><button id="sidebar-bottom" type="button" class="sidebar-bottom icon-button sp-sidebar-toggle" aria-label="Expand sidebar" aria-expanded="false"></button></aside>
<div class="breadcrumb"><span data-t="Home"></span> / <span data-t="AI Tools"></span> / <span data-t="AI Insights"></span> / <strong data-t="Competitor Comparison"></strong></div>
<main class="workspace">
<aside id="comparison-history" class="history-panel"><div class="history-search"><div class="history-search-field"><span id="history-search-icon"></span><input id="history-search" data-placeholder="Enter keywords to check history"></div><button id="history-hide" type="button" class="icon-button" aria-label="Hide comparison history" aria-controls="comparison-history" aria-expanded="true"></button></div><div id="history-scroll"><div id="history-list"></div><div class="history-pager"><button id="history-prev" aria-label="Previous history page">‹</button><span id="history-page">1 / 3</span><button id="history-next" aria-label="Next history page">›</button></div></div></aside>
<button id="history-show" type="button" class="icon-button" aria-label="Show comparison history" aria-controls="comparison-history" aria-expanded="false" hidden></button>
<section class="comparison-panel"><header class="comparison-heading"><h1 data-t="Competitor Comparison"></h1></header>
<div class="search-toolbar"><div class="product-search-field"><div id="channel-select"><span id="channel-selection"></span><button id="channel-trigger" type="button" aria-label="Select country and channel" aria-haspopup="dialog" aria-controls="channel-popup" aria-expanded="false"><span class="channel-caret" aria-hidden="true"></span></button></div><input id="product-search" data-placeholder="Enter ASIN #, SKU # or keywords to search products."></div><button id="search" class="primary" data-t="Search"></button><button id="new-comparison" type="button" class="primary" aria-haspopup="dialog" aria-controls="new-comparison-dialog"><img src="resource/imgs/competitor-comparison/new-comparison-add.svg" alt=""><span data-t="New comparison"></span></button></div>
<p class="quota"><img class="quota-icon" src="resource/imgs/competitor-comparison/notes-light.svg" alt=""><span id="quota-copy"></span></p>
<div class="products-area"><div id="products-table"></div><button id="compare" class="comparison-button">VS <span data-t="Comparison"></span></button><p id="comparison-status" role="status"></p></div>
<article class="analysis-report"><header class="report-toolbar"><button id="depth" class="depth-button"><span id="depth-icon"></span><span data-t="Depth Analysis"></span></button><button id="analysis-history" class="icon-button" aria-label="Analysis history"></button><span class="toolbar-spacer"></span><button id="download" class="icon-button" aria-label="Download report"></button><button id="report-fullscreen" class="icon-button" aria-label="Expand report"></button></header><div id="report-content"></div></article>
</section>
<aside class="chat-panel" hidden><header><h2 data-t="Depth Analysis"></h2><button id="chat-close" class="icon-button" aria-label="Close depth analysis"></button></header><div id="chat-messages" aria-live="polite"></div><div class="chat-actions"><button id="new-chat" data-t="New Chat"></button></div><form id="chat-form"><textarea id="chat-input" maxlength="2000" data-placeholder="Please enter prompt"></textarea><footer><span id="chat-count">0/2000</span><button type="button" id="chat-clear"><span id="clear-icon"></span><span data-t="Clear"></span></button><button class="send" type="submit"><span id="send-icon"></span><span data-t="Send"></span></button></footer></form></aside>
</main>
<section id="channel-popup" class="channel-popup" role="dialog" aria-label="Select country and channel" hidden></section>
<section id="search-results" class="search-results" role="dialog" aria-label="Product search results" hidden></section>
<section id="analysis-history-popup" class="analysis-history-popup" role="dialog" aria-label="Depth analysis history" hidden></section>
<div class="toast" role="status" hidden></div>
</div>
<dialog id="new-comparison-dialog" aria-labelledby="new-comparison-title">
  <form id="new-comparison-form">
    <header>
      <h2 id="new-comparison-title" data-t="New Competitive Comparison"></h2>
      <button id="new-comparison-close" type="button" class="icon-button" aria-label="Close new comparison"></button>
    </header>
    <div class="comparison-drawer-body">
      <div class="comparison-tabs" role="tablist" aria-label="Product import method">
        <button id="comparison-url-tab" type="button" role="tab" aria-controls="comparison-url-panel" data-t="Import Through URL"></button>
        <button id="comparison-manual-tab" type="button" role="tab" aria-controls="comparison-manual-panel" data-t="Add Manually"></button>
      </div>
      <div id="comparison-url-panel" role="tabpanel" aria-labelledby="comparison-url-tab">
        <div class="comparison-url-box">
          <textarea id="comparison-urls" aria-label="Product URLs" data-placeholder="Paste product URLs here, one per line or comma-separated."></textarea>
          <div class="comparison-url-actions">
            <button id="comparison-clear" type="button"><img src="resource/imgs/competitor-comparison/trash.svg" alt=""><span data-t="Clear"></span></button>
            <button id="comparison-url-add" type="button" class="primary" data-t="Add" disabled></button>
          </div>
        </div>
      </div>
      <div id="comparison-manual-panel" role="tabpanel" aria-labelledby="comparison-manual-tab" hidden>
        <div class="comparison-divider"><span data-t="Or add manually"></span></div>
        <div class="comparison-manual">
          <label class="comparison-marketplace">
            <span id="comparison-platform-icon" aria-hidden="true"></span>
            <select id="comparison-platform" aria-label="Marketplace">
              <option>Amazon</option><option selected>Newegg</option><option>Walmart</option><option>eBay</option><option>TikTok</option>
            </select>
          </label>
          <input id="comparison-product-id" aria-label="Product ID" data-placeholder="Enter product ID">
        </div>
      </div>
      <div id="comparison-examples" class="comparison-examples"></div>
      <p id="comparison-input-error" role="status" hidden></p>
      <div class="comparison-preview-toolbar">
        <button id="comparison-add" type="button" class="primary" hidden disabled><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h8M8 4v8"/></svg><span data-t="Add Product"></span></button>
        <button id="comparison-delete" type="button" class="outline" disabled><img src="resource/imgs/competitor-comparison/trash.svg" alt=""><span data-t="Delete"></span></button>
      </div>
      <table class="comparison-preview-table">
        <thead><tr>
          <th><input id="comparison-check-all" type="checkbox" aria-label="Select all preview products" disabled></th>
          <th data-t="Product"></th><th data-t="Current Price"></th><th data-t="Brand"></th>
          <th data-t="ASIN"></th><th data-t="Ratings"></th><th data-t="Action"></th>
        </tr></thead>
        <tbody id="comparison-pending"></tbody>
      </table>
      <div id="comparison-empty" class="comparison-preview-empty">
        <img src="resource/imgs/competitor-comparison/no-data.svg" alt="">
        <span data-t="No Data"></span><small id="comparison-empty-hint"></small>
      </div>
    </div>
    <footer>
      <button id="comparison-cancel" type="button" class="outline" data-t="Cancel"></button>
      <button id="comparison-next" type="submit" class="primary" data-t="Confirm" disabled></button>
    </footer>
  </form>
</dialog>
<script src="resource/scripts/competitor-comparison/competitor-comparison.js"></script><script src="resource/scripts/sellingpilot/sellingpilot-shared-navigation.js"></script></body></html>
